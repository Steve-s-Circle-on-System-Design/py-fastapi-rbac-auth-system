repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-lll"]

  - repo: local
    hooks:
      - id: uv-audit
        name: uv audit
        entry: uv audit
        language: system
        pass_filenames: false
